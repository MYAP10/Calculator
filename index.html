
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="display">
        <div id="calculation"></div>
        <div id="result">0</div>
    </div>

    <div id="arithmeticButtons">

        <button id="clearallBtn">Clear</button>
        <button id="deleteBtn">Delete</button>

        <button id="divisionBtn">/</button>
        <button id="multiplicationBtn">*</button>
        <button id="subtractionBtn">-</button>
        <button id="additionBtn">+</button>

        <button id="equalstoBtn">=</button>

        <button class="number" id="zerobtn">0</button>
        <button id="decimals">.</button>

        <button class="number" id="onebtn">1</button>
        <button class="number" id="twobtn">2</button>
        <button class="number" id="threebtn">3</button>
        <button class="number" id="fourbtn">4</button>
        <button class="number" id="fivebtn">5</button>
        <button class="number" id="sixbtn">6</button>
        <button class="number" id="sevenbtn">7</button>
        <button class="number" id="eigthbtn">8</button>
        <button class="number" id="ninebtn">9</button>

    </div>

</body>
</html>
